name: E2E

# Deploys go out through the Vercel CLI, which sends GitHub no deployment
# event, so the suite runs against a local production build on every PR and
# push to main. Mail-sending tests (@smtp, @infra) run only by hand against a
# deployed URL, so no PR sends mail.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed URL to test, including mail delivery"
        required: true
        default: "https://www.ws-gong.com"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps

      - name: Build and start
        if: ${{ !inputs.base_url }}
        run: |
          pnpm build
          pnpm start &
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3000

      - name: Core e2e tests
        run: pnpm exec playwright test --grep-invert "@infra|@smtp"

      - name: Mail e2e tests
        if: ${{ inputs.base_url }}
        continue-on-error: true
        run: pnpm exec playwright test --grep "@infra|@smtp"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
