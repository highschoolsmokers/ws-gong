name: E2E

# Runs against a local production build on every PR and push to main.
# Playwright starts the server itself (webServer in playwright.config.ts).
# Mail-sending tests (@smtp, @infra) run only by hand against a deployed URL,
# so no PR sends mail.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed URL to test, including mail delivery"
        required: true
        default: "https://www.ws-gong.com"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # Hard ceilings so a hung step fails fast instead of running for an hour.
    timeout-minutes: 15
    env:
      # Set only for a deployed run; otherwise Playwright serves the build.
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 3

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Build
        if: ${{ !inputs.base_url }}
        timeout-minutes: 5
        run: pnpm build

      - name: Core e2e tests
        timeout-minutes: 5
        run: pnpm exec playwright test

      - name: Mail e2e tests
        if: ${{ inputs.base_url }}
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm exec playwright test --project=chromium --grep "@infra|@smtp"
        env:
          MAIL_E2E: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
