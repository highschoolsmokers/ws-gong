name: CI

# On PRs only: pre-push already runs lint, typecheck, and unit tests, and
# the build is covered by the E2E job and the Vercel preview.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Audit
        run: pnpm audit --audit-level=high
