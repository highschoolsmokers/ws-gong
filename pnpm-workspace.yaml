# pnpm 11 requires explicit approval for build scripts. Without these flags
# `pnpm install --frozen-lockfile` errors on ignored builds in CI.
allowBuilds:
  "@sentry/cli": true
  sharp: true
  unrs-resolver: true

# GHSA-mrhx-c7xc-m3w5: zod <4.6.6 arrives via @vercel/blob > @vercel/oidc >
# @vercel/cli-config. Drop once that chain ships a patched zod.
overrides:
  "@vercel/cli-config>zod": ">=4.6.6"

# GHSA-fc5q-39xc-vjpf: picomatch <=4.0.7 ReDoS on repeated extglobs, with no
# patched release yet. It only runs at build/lint time (eslint, lint-staged,
# Sentry's rollup plugin) on our own config globs, never on visitor input.
# Drop once picomatch ships a fix, and bump it via an override instead.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
